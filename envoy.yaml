static_resources:
  listeners:
  - name: listener_0
    address: { socket_address: { address: 0.0.0.0, port_value: 9090 } }
    # ===== ANTI-DDOS: GLOBAL CONNECTION LIMIT =====
    per_connection_buffer_limit_bytes: 32768
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: AUTO
          # ===== ANTI-DDOS: REQUEST/CONNECTION LIMITS =====
          common_http_protocol_options:
            max_headers_count: 100
            max_request_headers_kb: 8
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65535
            initial_connection_window_size: 1048576
          # ORIGINAL: WebSocket & h2c support (WALANG BINAGO)
          upgrade_configs:
          - upgrade_type: websocket
            enabled: true
          - upgrade_type: h2c
            enabled: true
          route_config:
            name: all_routes
            virtual_hosts:
            - name: xray
              domains: ["*"]
              # ===== ANTI-DDOS: PER-VHOST RATE LIMIT =====
              rate_limits:
              - stage: 0
                actions:
                - request_headers:
                    header_name: ":path"
                    exact_match: "/"
                - token_bucket:
                    tokens_per_fill: 100
                    fill_interval: 1s
              routes:
              - match: { prefix: "/" }
                route: { cluster: xray_backend, timeout: 3600s }
          http_filters:
          # ===== ANTI-DDOS: RATE LIMIT FILTER =====
          - name: envoy.filters.http.ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
              domain: "xray_protection"
              failure_mode_deny: true
              rate_limited_as_http: true
          - name: envoy.filters.http.router
            typed_config: {}
  clusters:
  - name: xray_backend
    connect_timeout: 10s
    type: STATIC
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: xray_backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10000 } } }
