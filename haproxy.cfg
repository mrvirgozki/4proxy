global
    log stdout format raw local0 info
    maxconn 5000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend http_front
    bind 0.0.0.0:8443
    default_backend xray_nodes
    # Suporta para sa WebSocket at gRPC
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_websocket hdr_connection -i upgrade
    use_backend xray_nodes if is_websocket

backend xray_nodes
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server xray1 127.0.0.1:10000 check inter 5s rise 2 fall 3
    # Alisin ang pangalawang server kung wala ka pang Xray sa port 10012
    # server xray2 127.0.0.1:10012 check inter 5s rise 2 fall 3
