global
    log stdout format raw local0 info
    maxconn 5000
    # Dagdag: Sysctl level anti-DDoS
    tune.ssl.default-dh-param 2048
    tune.maxrewrite 1024

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    option forwardfor
    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout queue 5s

    # ===== ANTI-DDOS RULES (NADAGDAG LANG) =====
    # Limit: Max 100 requests / 10s bawat IP
    stick-table type ip size 1m expire 10m store http_req_rate(10s)
    acl too_many_req sc_http_req_rate(0) gt 100
    http-request deny if too_many_req

    # Limit: Max 50 sabay na koneksyon bawat IP
    stick-table type ip size 1m expire 10m store conn_cur
    acl too_many_conn sc_conn_cur(0) gt 50
    http-request deny if too_many_conn

    # Harangan ang masasamang requests
    acl bad_method method CONNECT
    acl bad_path path -i -f /dev/null
    http-request deny if bad_method
    http-request deny deny_status 403 if { req.len gt 8192 }

frontend http_front
    bind 0.0.0.0:8443
    default_backend xray_nodes
    # Suporta para sa WebSocket at gRPC (ORIGINAL - WALANG BINAGO)
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_websocket hdr_connection -i upgrade
    use_backend xray_nodes if is_websocket

backend xray_nodes
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server xray1 127.0.0.1:10000 check inter 5s rise 2 fall 3
    # Alisin ang pangalawang server kung wala ka pang Xray sa port 10012
    # server xray2 127.0.0.1:10012 check inter 5s rise 2 fall 3
