global
    log stdout format raw local0 info
    maxconn 5000
    tune.ssl.default-dh-param 2048
    tune.maxrewrite 1024

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    option forwardfor

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout queue 5s


frontend http_front

    bind 0.0.0.0:8080

    # =====================================
    # ANTI-DDoS: CONNECTION LIMIT PER IP
    # =====================================

    stick-table type ip size 1m expire 10m store conn_cur

    tcp-request connection track-sc0 src

    acl too_many_conn sc_conn_cur(0) gt 50
    tcp-request connection reject if too_many_conn


    # =====================================
    # ANTI-DDoS: REQUEST RATE PER IP
    # =====================================

    stick-table type ip size 1m expire 10m store http_req_rate(10s)

    http-request track-sc1 src

    acl too_many_req sc_http_req_rate(1) gt 100
    http-request deny deny_status 429 if too_many_req


    # =====================================
    # BASIC REQUEST PROTECTION
    # =====================================

    # Block CONNECT method
    acl bad_method method CONNECT
    http-request deny deny_status 405 if bad_method

    # Limit request size
    http-request deny deny_status 403 if { req.len gt 8192 }


    # =====================================
    # XRAY BACKEND
    # =====================================

    default_backend xray_nodes


backend xray_nodes

    balance roundrobin

    # TCP health check
    server xray1 127.0.0.1:10000 check inter 5s rise 2 fall 3
