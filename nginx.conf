user root;  # ✅ DAGDAG LANG ITO — ayos permission issue
worker_processes 1;
error_log /dev/stdout info;

# ===== ANTI-DDOS =====
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    grpc_connect_timeout 10s;
    grpc_send_timeout 3600s;
    grpc_read_timeout 3600s;

    server {
        listen 0.0.0.0:8080 http2;
        listen [::]:8080 http2;  # ✅ DAGDAG LANG ITO — IPv6 support
        server_name _;

        # ===== ANTI-DDOS LIMITS =====
        limit_req zone=req_limit burst=30 nodelay;
        limit_conn conn_limit 30;
        client_body_timeout 10s;
        send_timeout 10s;

        # ============== LAHAT NG PATHS MO — WALANG BINAGO ==============
        location /virgozki { 
            proxy_pass http://127.0.0.1:10000; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /virgozki-hu { 
            proxy_pass http://127.0.0.1:10001; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10002; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /vmess-virgozki { 
            proxy_pass http://127.0.0.1:10003; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vmess-virgozki-hu { 
            proxy_pass http://127.0.0.1:10004; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vmess-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10005; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /vless-virgozki { 
            proxy_pass http://127.0.0.1:10006; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vless-virgozki-hu { 
            proxy_pass http://127.0.0.1:10007; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vless-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10008; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ss-virgozki { 
            proxy_pass http://127.0.0.1:10009; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /ss-virgozki-hu { 
            proxy_pass http://127.0.0.1:10010; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /ss-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10011; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # gRPC paths — WALANG BINAGO
        location /vless-grpc-virgozki {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10012;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }
        location /vmess-grpc-virgozki {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10013;
