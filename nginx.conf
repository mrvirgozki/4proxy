user root;
worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
worker_connections 4096;
}

http {
include /usr/local/openresty/nginx/conf/mime.types;
default_type application/octet-stream;

access_log /dev/stdout;

# ==================================================
# PER-IP REQUEST RATE LIMIT
# 400 requests/sec per client IP
# Burst up to 800
# Excess requests return HTTP 429
# ==================================================

limit_req_zone $binary_remote_addr
    zone=proxy_rate:20m
    rate=400r/s;

# ==================================================
# PER-IP CONNECTION LIMIT
# Maximum 50 concurrent connections per client IP
# ==================================================

limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

# ==================================================
# BASIC HTTP SETTINGS
# ==================================================

sendfile on;
keepalive_timeout 65;

# Prevent excessively large request headers
large_client_header_buffers 4 8k;

server {
    listen 8080 http2;
    server_name _;

    # ==================================================
    # CONNECTION LIMIT
    # ==================================================

    limit_conn conn_limit 50;

    # ==================================================
    # GLOBAL REQUEST SIZE LIMIT
    # ==================================================

    client_max_body_size 8m;

    # ==================================================
    # SECURITY HEADERS
    # ==================================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ==================================================
    # TROJAN WS
    # ==================================================

    location /virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # TROJAN HTTPUPGRADE
    # ==================================================

    location /virgozki-hu {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # TROJAN XHTTP
    # ==================================================

    location /virgozki-xhttp {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VMESS WS
    # ==================================================

    location /vmess-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VMESS HTTPUPGRADE
    # ==================================================

    location /vmess-virgozki-hu {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VMESS XHTTP
    # ==================================================

    location /vmess-virgozki-xhttp {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VLESS WS
    # ==================================================

    location /vless-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VLESS HTTPUPGRADE
    # ==================================================

    location /vless-virgozki-hu {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10007;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VLESS XHTTP
    # ==================================================

    location /vless-virgozki-xhttp {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10008;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # SHADOWSOCKS WS
    # ==================================================

    location /ss-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10009;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # SHADOWSOCKS HTTPUPGRADE
    # ==================================================

    location /ss-virgozki-hu {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # SHADOWSOCKS XHTTP
    # ==================================================

    location /ss-virgozki-xhttp {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:10011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================
    # VLESS gRPC
    # ==================================================

    location /vless-grpc-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        client_max_body_size 0;

        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://127.0.0.1:10012;
    }

    # ==================================================
    # VMESS gRPC
    # ==================================================

    location /vmess-grpc-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        client_max_body_size 0;

        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://127.0.0.1:10013;
    }

    # ==================================================
    # TROJAN gRPC
    # ==================================================

    location /trojan-grpc-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        client_max_body_size 0;

        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://127.0.0.1:10014;
    }

    # ==================================================
    # SHADOWSOCKS gRPC
    # ==================================================

    location /ss-grpc-virgozki {
        limit_req zone=proxy_rate burst=800 nodelay;
        limit_req_status 429;

        client_max_body_size 0;

        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://127.0.0.1:10015;
    }

    # ==================================================
    # DEFAULT WEBSITE
    # ==================================================

    location / {
        root /usr/local/openresty/nginx/html;
        index index.html;
    }
}

}
