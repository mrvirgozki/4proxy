user root;
worker_processes auto;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 8080 http2;
        server_name _;

        limit_req zone=req_limit burst=30 nodelay;
        limit_conn conn_limit 30;

        # =========================
        # TROJAN WS
        # =========================
        location /virgozki {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # TROJAN HTTPUPGRADE
        # =========================
        location /virgozki-hu {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # TROJAN XHTTP
        # =========================
        location /virgozki-xhttp {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =========================
        # VMESS WS
        # =========================
        location /vmess-virgozki {
            proxy_pass http://127.0.0.1:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # VMESS HTTPUPGRADE
        # =========================
        location /vmess-virgozki-hu {
            proxy_pass http://127.0.0.1:10004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # VMESS XHTTP
        # =========================
        location /vmess-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =========================
        # VLESS WS
        # =========================
        location /vless-virgozki {
            proxy_pass http://127.0.0.1:10006;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # VLESS HTTPUPGRADE
        # =========================
        location /vless-virgozki-hu {
            proxy_pass http://127.0.0.1:10007;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # VLESS XHTTP
        # =========================
        location /vless-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10008;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =========================
        # SHADOWSOCKS WS
        # =========================
        location /ss-virgozki {
            proxy_pass http://127.0.0.1:10009;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # SHADOWSOCKS HTTPUPGRADE
        # =========================
        location /ss-virgozki-hu {
            proxy_pass http://127.0.0.1:10010;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # =========================
        # SHADOWSOCKS XHTTP
        # =========================
        location /ss-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==================================================
        # VLESS gRPC
        # Xray inbound: 127.0.0.1:10012
        # serviceName: vless-grpc-virgozki
        # ==================================================
        location /vless-grpc-virgozki {
            client_max_body_size 0;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10012;
        }

        # ==================================================
        # VMESS gRPC
        # Xray inbound: 127.0.0.1:10013
        # serviceName: vmess-grpc-virgozki
        # ==================================================
        location /vmess-grpc-virgozki {
            client_max_body_size 0;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10013;
        }

        # ==================================================
        # TROJAN gRPC
        # Xray inbound: 127.0.0.1:10014
        # serviceName: trojan-grpc-virgozki
        # ==================================================
        location /trojan-grpc-virgozki {
            client_max_body_size 0;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10014;
        }

        # ==================================================
        # SHADOWSOCKS gRPC
        # Xray inbound: 127.0.0.1:10015
        # serviceName: ss-grpc-virgozki
        # ==================================================
        location /ss-grpc-virgozki {
            client_max_body_size 0;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10015;
        }

        # =========================
        # DEFAULT WEBSITE
        # =========================
        location / {
            root /usr/local/openresty/nginx/html;
            index index.html;
        }
    }
}
