user root;
worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

include /usr/local/openresty/nginx/conf/mime.types;
default_type application/octet-stream;

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        limit_req zone=req_limit burst=30 nodelay;
        limit_conn conn_limit 30;

        # Lahat ng paths mo — walang binago
        location /virgozki { proxy_pass http://127.0.0.1:10000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /virgozki-hu { proxy_pass http://127.0.0.1:10001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /virgozki-xhttp { proxy_pass http://127.0.0.1:10002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_set_header X-Real-IP $remote_addr; }
        location /vmess-virgozki { proxy_pass http://127.0.0.1:10003; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /vmess-virgozki-hu { proxy_pass http://127.0.0.1:10004; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /vmess-virgozki-xhttp { proxy_pass http://127.0.0.1:10005; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_set_header X-Real-IP $remote_addr; }
        location /vless-virgozki { proxy_pass http://127.0.0.1:10006; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /vless-virgozki-hu { proxy_pass http://127.0.0.1:10007; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /vless-virgozki-xhttp { proxy_pass http://127.0.0.1:10008; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_set_header X-Real-IP $remote_addr; }
        location /ss-virgozki { proxy_pass http://127.0.0.1:10009; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /ss-virgozki-hu { proxy_pass http://127.0.0.1:10010; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
        location /ss-virgozki-xhttp { proxy_pass http://127.0.0.1:10011; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_set_header X-Real-IP $remote_addr; }
        location /vless-grpc-virgozki { if ($content_type !~ "application/grpc") { return 404; } client_max_body_size 0; grpc_pass grpc://127.0.0.1:10012; grpc_set_header Host $host; grpc_set_header X-Real-IP $remote_addr; }
        location /vmess-grpc-virgozki { if ($content_type !~ "application/grpc") { return 404; } client_max_body_size 0; grpc_pass grpc://127.0.0.1:10013; grpc_set_header Host $host; }
        location /trojan-grpc-virgozki { if ($content_type !~ "application/grpc") { return 404; } client_max_body_size 0; grpc_pass grpc://127.0.0.1:10014; grpc_set_header Host $host; }
        location /ss-grpc-virgozki { if ($content_type !~ "application/grpc") { return 404; } client_max_body_size 0; grpc_pass grpc://127.0.0.1:10015; grpc_set_header Host $host; }
        location / { root /usr/local/openresty/nginx/html; index index.html; }
    }
}
